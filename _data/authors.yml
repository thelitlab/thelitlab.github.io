# Lab members. This file drives BOTH the People page and blog-post bylines.
#
# The key (e.g. `sagnik`) is the id you put in a blog post's front matter:
#     author: sagnik
#
# Fields:
#   name          (required) full name
#   group         (required) one of: pi, postdoc, phd, ms, undergrad, alumni
#   position      short role shown on the People page, e.g. "PhD student (2024–)"
#   avatar        file in /images/people/ (square, ~400x400), or a full https:// URL
#   bio           one or two sentences
#   uri           personal website
#   email, github, googlescholar, orcid, linkedin   optional links
#   now           (alumni only) where they are now

sagnik:
  name          : "Sagnik Ray Choudhury"
  group         : pi
  position      : "Assistant Professor, CSE, UNT"
  avatar        : "people/sagnik.jpeg"
  bio           : "Applied NLP/ML researcher: explaining LLM behaviour and limitations, and scholarly information processing."
  uri           : "https://sagnikrayc.xyz/"
  email         : "sagnikrayc@gmail.com"
  github        : "sagnik"
  googlescholar : "https://scholar.google.com/citations?user=xl5b_vcAAAAJ"

