# Lab members. This file drives BOTH the People page and blog-post bylines.
#
# The key (e.g. `sagnik`) is the id you put in a blog post's front matter:
#     author: sagnik
#
# Fields:
#   name          (required) full name
#   position      role shown under the name, e.g. "PhD student (2024–)"
#   avatar        file in /images/people/ (square, ~400x400), or a full https:// URL
#   bio           one or two sentences
#   uri           personal website
#   email, github, googlescholar, orcid, linkedin   optional links
#   now           (alumni) where they are now
#
# Everyone is shown together on the People page, in the order listed here.

sagnik:
