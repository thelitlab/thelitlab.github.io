  position      : "Assistant Professor, CSE, UNT"
  avatar        : "people/sagnik.jpeg"
  bio           : "Applied NLP/ML researcher studying model behavior, evaluation and learning from feedback, and language technologies for scientific knowledge."
  uri           : "https://sagnikrayc.xyz/"
  email         : "sagnikrayc@gmail.com"
  github        : "sagnik"
  googlescholar : "https://scholar.google.com/citations?user=xl5b_vcAAAAJ"

