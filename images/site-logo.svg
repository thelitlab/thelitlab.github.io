<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t">
  <title id="t">LITLab: Language, Interpretability, and Trust</title>
  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>

  <!-- light macOS-style window, matching the research overview figure -->
  <rect x="5" y="5" width="790" height="390" rx="30" fill="#f8fafb" stroke="#d5dae1" stroke-width="2.5"/>
  <path d="M35 5 H765 A30 30 0 0 1 795 35 V64 H5 V35 A30 30 0 0 1 35 5 Z" fill="#eceff3"/>
