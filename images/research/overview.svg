<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="t d">
  <title id="t">LIT@UNT research overview</title>
  <desc id="d">Four connected research directions: understanding model behavior; evaluation and learning from feedback; language technologies for scientific knowledge; and accountability, law and governance.</desc>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7a93"/>
    </marker>
    <style>
      .mono  { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .num   { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
      .ttl   { font-size: 24px; font-weight: 700; fill: #f4f7fa; }
      .kw    { font-size: 14px; fill: #9fb3c4; }
      .q     { font-size: 13.5px; fill: #6f8aa1; font-style: italic; }
      .wire  { stroke: #33475a; stroke-width: 2; }
      .link  { stroke: #5b7a93; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <!-- terminal window, as in the lab logo -->
  <rect x="14" y="14" width="1172" height="892" rx="38" fill="#06111b" stroke="#2b8fe0" stroke-width="4" filter="url(#glow)"/>
  <circle cx="68" cy="58" r="11" fill="#f0605d"/>
  <circle cx="104" cy="58" r="11" fill="#f5c84c"/>
  <circle cx="140" cy="58" r="11" fill="#2ee6b0"/>
  <text x="182" y="64" class="mono" font-size="17" fill="#6f8aa1">~/lit@unt/research $ <tspan fill="#f4f7fa">ls --connected</tspan></text>
  <line x1="18" y1="92" x2="1182" y2="92" stroke="#2b8fe0" stroke-opacity="0.55" stroke-width="2"/>

  <!-- panel frames: 2x2, read clockwise 01 → 02 → 03 → 04 -->
  <rect x="56"  y="124" width="520" height="330" rx="20" fill="#0b1b29" stroke="#f5c84c" stroke-width="2.5"/>
  <rect x="624" y="124" width="520" height="330" rx="20" fill="#0b1b29" stroke="#2ee6b0" stroke-width="2.5"/>
  <rect x="624" y="494" width="520" height="330" rx="20" fill="#0b1b29" stroke="#f0605d" stroke-width="2.5"/>
  <rect x="56"  y="494" width="520" height="330" rx="20" fill="#0b1b29" stroke="#5aa9ff" stroke-width="2.5"/>

  <!-- connections: a loop, not silos -->
  <path class="link" d="M582 289 L618 289" marker-end="url(#arrow)"/>
  <path class="link" d="M884 460 L884 488" marker-end="url(#arrow)"/>
  <path class="link" d="M618 659 L582 659" marker-end="url(#arrow)"/>
  <path class="link" d="M316 488 L316 460" marker-end="url(#arrow)"/>

  <!-- ============ 01 Understanding model behavior (yellow) ============ -->
  <g class="mono">
    <text x="84" y="168" class="num" fill="#f5c84c">01</text>
    <text x="84" y="204" class="ttl">Understanding</text>
    <text x="84" y="234" class="ttl">model behavior</text>
    <text x="84" y="330" class="kw">representations</text>
    <text x="84" y="354" class="kw">reasoning · context use</text>
    <text x="84" y="378" class="kw">explanations</text>
    <text x="84" y="420" class="q">how do models use</text>
    <text x="84" y="440" class="q">information?</text>
  </g>
  <g transform="translate(240.8 42.3) scale(0.9)">
    <g class="wire">
      <line x1="110" y1="262" x2="190" y2="248"/><line x1="110" y1="262" x2="190" y2="292"/><line x1="110" y1="262" x2="190" y2="336"/>
      <line x1="110" y1="314" x2="190" y2="248"/><line x1="110" y1="314" x2="190" y2="336"/><line x1="110" y1="314" x2="190" y2="380"/>
      <line x1="110" y1="366" x2="190" y2="292"/><line x1="110" y1="366" x2="190" y2="380"/>
      <line x1="190" y1="248" x2="270" y2="270"/><line x1="190" y1="292" x2="270" y2="270"/><line x1="190" y1="336" x2="270" y2="358"/>
      <line x1="190" y1="380" x2="270" y2="358"/><line x1="190" y1="248" x2="270" y2="358"/>
    </g>
    <polyline points="110,314 190,292 270,270" fill="none" stroke="#f5c84c" stroke-width="4" stroke-linecap="round" filter="url(#softglow)"/>
    <g fill="#16293a" stroke="#5b7a93" stroke-width="2">
      <circle cx="110" cy="262" r="11"/><circle cx="110" cy="366" r="11"/>
      <circle cx="190" cy="248" r="11"/><circle cx="190" cy="336" r="11"/><circle cx="190" cy="380" r="11"/>
      <circle cx="270" cy="358" r="11"/>
    </g>
    <g fill="#f5c84c" filter="url(#softglow)">
      <circle cx="110" cy="314" r="12"/><circle cx="190" cy="292" r="12"/><circle cx="270" cy="270" r="12"/>
    </g>
    <circle cx="272" cy="274" r="36" fill="#f5c84c" fill-opacity="0.10" stroke="#f4f7fa" stroke-width="4"/>
    <line x1="298" y1="300" x2="326" y2="328" stroke="#f4f7fa" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- ============ 02 Evaluation & learning from feedback (green) ============ -->
  <g class="mono">
    <text x="652" y="168" class="num" fill="#2ee6b0">02</text>
    <text x="652" y="204" class="ttl">Evaluation &amp;</text>
    <text x="652" y="234" class="ttl">learning from feedback</text>
    <text x="652" y="330" class="kw">preferences</text>
    <text x="652" y="354" class="kw">rubrics · LLM judges</text>
    <text x="652" y="378" class="kw">rationales</text>
    <text x="652" y="420" class="q">how should outputs</text>
    <text x="652" y="440" class="q">be judged?</text>
  </g>
  <g class="mono" transform="translate(533.2 70.4) scale(0.8)">
    <rect x="458" y="248" width="112" height="50" rx="10" fill="#16293a" stroke="#5b7a93" stroke-width="2"/>
    <path d="M476 298 l0 14 l14 -14 z" fill="#16293a" stroke="#5b7a93" stroke-width="2" stroke-linejoin="round"/>
    <text x="472" y="279" font-size="16" font-weight="700" fill="#f4f7fa">A</text>
    <line x1="494" y1="266" x2="556" y2="266" stroke="#5b7a93" stroke-width="3" stroke-linecap="round"/>
    <line x1="494" y1="280" x2="540" y2="280" stroke="#5b7a93" stroke-width="3" stroke-linecap="round"/>
    <rect x="458" y="326" width="112" height="50" rx="10" fill="#16293a" stroke="#2ee6b0" stroke-width="2.5" filter="url(#softglow)"/>
    <path d="M476 376 l0 14 l14 -14 z" fill="#16293a" stroke="#2ee6b0" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="472" y="357" font-size="16" font-weight="700" fill="#2ee6b0">B</text>
    <line x1="494" y1="344" x2="556" y2="344" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/>
    <line x1="494" y1="358" x2="548" y2="358" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/>
    <path d="M578 312 L610 312" stroke="#5b7a93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="616" y="244" width="128" height="146" rx="12" fill="#16293a" stroke="#5b7a93" stroke-width="2"/>
    <text x="630" y="268" font-size="12" fill="#9fb3c4" letter-spacing="1">RUBRIC</text>
    <g stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="630" y="282" width="16" height="16" rx="3" stroke="#5b7a93" stroke-width="2"/>
      <polyline points="633,290 637,295 644,285" stroke="#2ee6b0"/>
      <line x1="656" y1="290" x2="728" y2="290" stroke="#5b7a93"/>
      <rect x="630" y="310" width="16" height="16" rx="3" stroke="#5b7a93" stroke-width="2"/>
      <polyline points="633,318 637,323 644,313" stroke="#2ee6b0"/>
      <line x1="656" y1="318" x2="716" y2="318" stroke="#5b7a93"/>
      <rect x="630" y="338" width="16" height="16" rx="3" stroke="#5b7a93" stroke-width="2"/>
      <path d="M634 342 l8 8 M642 342 l-8 8" stroke="#f0605d"/>
      <line x1="656" y1="346" x2="722" y2="346" stroke="#5b7a93"/>
    </g>
    <rect x="630" y="366" width="100" height="10" rx="5" fill="#0b1b29" stroke="#33475a"/>
    <rect x="630" y="366" width="68" height="10" rx="5" fill="#2ee6b0" filter="url(#softglow)"/>
  </g>

  <!-- ============ 03 Language tech for scientific knowledge (red) ============ -->
  <g class="mono">
    <text x="652" y="538" class="num" fill="#f0605d">03</text>
    <text x="652" y="574" class="ttl">Language tech for</text>
    <text x="652" y="604" class="ttl">scientific knowledge</text>
    <text x="652" y="700" class="kw">figures · tables</text>
    <text x="652" y="724" class="kw">claims · reproducibility</text>
    <text x="652" y="748" class="kw">limitations</text>
    <text x="652" y="790" class="q">how can evidence</text>
    <text x="652" y="810" class="q">guide us?</text>
  </g>
  <g class="mono" transform="translate(179.3 422.85) scale(0.85)">
    <path d="M846 244 h86 l24 24 v126 h-110 z" fill="#16293a" stroke="#5b7a93" stroke-width="2" stroke-linejoin="round"/>
    <path d="M932 244 v24 h24" fill="none" stroke="#5b7a93" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#5b7a93" stroke-width="3" stroke-linecap="round">
      <line x1="860" y1="266" x2="916" y2="266"/><line x1="860" y1="280" x2="938" y2="280"/>
      <line x1="860" y1="370" x2="938" y2="370"/><line x1="860" y1="382" x2="920" y2="382"/>
    </g>
    <rect x="860" y="294" width="80" height="64" rx="4" fill="#0b1b29" stroke="#f0605d" stroke-width="2"/>
    <g fill="#f0605d">
      <rect x="870" y="334" width="11" height="18"/><rect x="887" y="320" width="11" height="32"/>
      <rect x="904" y="308" width="11" height="44"/><rect x="921" y="326" width="11" height="26"/>
    </g>
    <path d="M946 326 C 966 326, 970 300, 990 300" stroke="#5b7a93" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="996" y="262" width="122" height="78" rx="6" fill="#16293a" stroke="#f0605d" stroke-width="2" filter="url(#softglow)"/>
    <line x1="996" y1="288" x2="1118" y2="288" stroke="#f0605d" stroke-width="1.5"/>
    <line x1="996" y1="314" x2="1118" y2="314" stroke="#33475a" stroke-width="1.5"/>
    <line x1="1040" y1="262" x2="1040" y2="340" stroke="#33475a" stroke-width="1.5"/>
    <line x1="1080" y1="262" x2="1080" y2="340" stroke="#33475a" stroke-width="1.5"/>
    <g stroke="#9fb3c4" stroke-width="3" stroke-linecap="round">
      <line x1="1006" y1="276" x2="1030" y2="276"/><line x1="1050" y1="276" x2="1070" y2="276"/><line x1="1090" y1="276" x2="1108" y2="276"/>
      <line x1="1006" y1="302" x2="1026" y2="302"/><line x1="1050" y1="302" x2="1066" y2="302"/><line x1="1090" y1="302" x2="1104" y2="302"/>
      <line x1="1006" y1="328" x2="1030" y2="328"/><line x1="1050" y1="328" x2="1062" y2="328"/><line x1="1090" y1="328" x2="1110" y2="328"/>
    </g>
    <rect x="996" y="356" width="122" height="34" rx="17" fill="#16293a" stroke="#5b7a93" stroke-width="2"/>
    <polyline points="1012,373 1018,379 1028,367" fill="none" stroke="#2ee6b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1038" y="378" font-size="13" fill="#9fb3c4">supported</text>
  </g>

  <!-- ============ 04 Accountability, law & governance (blue) ============ -->
  <g class="mono">
    <text x="84" y="538" class="num" fill="#5aa9ff">04</text>
    <text x="84" y="574" class="ttl">Accountability,</text>
    <text x="84" y="604" class="ttl">law &amp; governance</text>
    <text x="84" y="700" class="kw">auditing models</text>
    <text x="84" y="724" class="kw">data protection</text>
    <text x="84" y="748" class="kw">AI regulation</text>
    <text x="84" y="790" class="q">can models be held</text>
    <text x="84" y="810" class="q">to account?</text>
  </g>
  <!-- scales: a model weighed against the law -->
  <g>
    <line x1="460" y1="628" x2="460" y2="772" stroke="#9fb3c4" stroke-width="5" stroke-linecap="round"/>
    <rect x="420" y="770" width="80" height="12" rx="5" fill="#16293a" stroke="#9fb3c4" stroke-width="2.5"/>
    <circle cx="460" cy="624" r="8" fill="#5aa9ff" filter="url(#softglow)"/>
    <line x1="388" y1="640" x2="532" y2="640" stroke="#f4f7fa" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#5b7a93" stroke-width="2">
      <line x1="388" y1="640" x2="362" y2="712"/><line x1="388" y1="640" x2="414" y2="712"/>
      <line x1="532" y1="640" x2="506" y2="712"/><line x1="532" y1="640" x2="558" y2="712"/>
    </g>
    <path d="M356 712 Q388 744 420 712 Z" fill="#16293a" stroke="#5aa9ff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M500 712 Q532 744 564 712 Z" fill="#16293a" stroke="#5aa9ff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- left pan: a model -->
    <g stroke="#5aa9ff" stroke-width="2">
      <line x1="374" y1="702" x2="388" y2="684"/><line x1="402" y1="702" x2="388" y2="684"/><line x1="374" y1="702" x2="402" y2="702"/>
    </g>
    <g fill="#5aa9ff" filter="url(#softglow)">
      <circle cx="374" cy="702" r="6"/><circle cx="402" cy="702" r="6"/><circle cx="388" cy="684" r="6"/>
    </g>
    <!-- right pan: the law -->
    <rect x="518" y="668" width="28" height="38" rx="3" fill="#16293a" stroke="#f4f7fa" stroke-width="2"/>
    <text x="532" y="694" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#f4f7fa">§</text>
  </g>

  <text x="600" y="870" text-anchor="middle" class="mono" font-size="18">
    <tspan fill="#f0605d">Language</tspan><tspan fill="#9fb3c4">, </tspan><tspan fill="#f5c84c">Interpretability</tspan><tspan fill="#9fb3c4">, and </tspan><tspan fill="#2ee6b0">Trust</tspan>
  </text>
</svg>
