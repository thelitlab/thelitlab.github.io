<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">LITLab research overview</title>
  <desc id="d">Interpretability at the center, connecting four problem areas: evaluation and peer review; generalization in NLP tasks; computational social science and the reliability of survey instruments; and law, governance and compliance.</desc>
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .num  { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .ttl  { font-size: 24px; font-weight: 700; fill: #17212b; }
      .kw   { font-size: 14px; fill: #4a5866; }
      .q    { font-size: 13.5px; fill: #6b7885; font-style: italic; }
      .card { fill: #fff; stroke: #9aa7b4; stroke-width: 2; }
      .ink  { stroke: #9aa7b4; stroke-width: 3; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- light macOS-style window -->
  <rect x="14" y="24" width="1172" height="872" rx="22" fill="#0b1b29" fill-opacity="0.04"/>
  <rect x="14" y="19" width="1172" height="872" rx="22" fill="#0b1b29" fill-opacity="0.05"/>
  <rect x="14" y="14" width="1172" height="872" rx="22" fill="#f8fafb" stroke="#d5dae1" stroke-width="1.5"/>
  <path d="M36 14 H1164 A22 22 0 0 1 1186 36 V76 H14 V36 A22 22 0 0 1 36 14 Z" fill="#eceff3"/>
  <line x1="14" y1="76" x2="1186" y2="76" stroke="#d5dae1" stroke-width="1.5"/>
  <circle cx="52" cy="45" r="8" fill="#ff5f57"/>
  <circle cx="80" cy="45" r="8" fill="#febc2e"/>
  <circle cx="108" cy="45" r="8" fill="#28c840"/>
  <text x="600" y="51" text-anchor="middle" class="mono" font-size="15" fill="#5b6672">litlab — research</text>

  <!-- spokes: every area connects through interpretability -->
  <g stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7">
    <line x1="459" y1="437" x2="432" y2="429" stroke="#1f6fd1"/>
    <line x1="741" y1="437" x2="768" y2="429" stroke="#b7791f"/>
    <line x1="741" y1="529" x2="768" y2="537" stroke="#d64541"/>
    <line x1="459" y1="529" x2="432" y2="537" stroke="#7a4cc9"/>
  </g>

  <!-- ===== hub: Interpretability ===== -->
  <circle cx="600" cy="483" r="148" fill="none" stroke="#00853E" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="600" cy="487" r="130" fill="#0b1b29" fill-opacity="0.10"/>
  <circle cx="600" cy="483" r="130" fill="#00853E"/>
  <g stroke="#bfe8d0" stroke-width="2.5">
    <line x1="558" y1="446" x2="586" y2="418"/><line x1="586" y1="418" x2="614" y2="446"/><line x1="558" y1="446" x2="614" y2="446"/>
  </g>
  <g fill="#bfe8d0"><circle cx="558" cy="446" r="7"/><circle cx="614" cy="446" r="7"/></g>
  <circle cx="586" cy="418" r="8" fill="#fff"/>
  <circle cx="592" cy="426" r="28" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="4"/>
  <line x1="612" y1="446" x2="634" y2="468" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="600" y="512" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#fff">Interpretability</text>
  <text x="600" y="540" text-anchor="middle" class="mono" font-size="13.5" fill="#d8f3e3">what models encode</text>
  <text x="600" y="559" text-anchor="middle" class="mono" font-size="13.5" fill="#d8f3e3">and use, and why</text>

  <!-- ===== 01 Evaluation & peer review (blue), top-left ===== -->
  <g class="mono">
    <rect x="50" y="111" width="380" height="320" rx="18" fill="#0b1b29" fill-opacity="0.06"/>
    <rect x="50" y="108" width="380" height="320" rx="18" fill="#fff"/>
    <rect x="50" y="108" width="380" height="320" rx="18" fill="#1f6fd1" fill-opacity="0.04" stroke="#1f6fd1" stroke-width="2"/>
    <text x="78" y="150" class="num" fill="#1f6fd1">01</text>
    <text x="78" y="186" class="ttl">Evaluation &amp;</text>
    <text x="78" y="216" class="ttl">peer review</text>
    <text x="78" y="288" class="kw">alignment with human</text>
    <text x="78" y="312" class="kw">reasoning faithfulness</text>
    <text x="78" y="336" class="kw">peer review reliability</text>
    <text x="78" y="390" class="q">what drives a model judgment,</text>
    <text x="78" y="408" class="q">and does the rationale reflect it?</text>
  </g>
  <g transform="translate(340 280)">
    <rect x="-48" y="-58" width="84" height="108" rx="8" class="card"/>
    <line x1="-36" y1="-40" x2="20" y2="-40" class="ink"/>
    <line x1="-36" y1="-28" x2="8" y2="-28" class="ink"/>
    <text x="-37" y="-6" font-size="16" fill="#1f6fd1" font-family="sans-serif">★★★☆</text>
    <rect x="-36" y="6" width="12" height="12" rx="2" fill="none" stroke="#9aa7b4" stroke-width="2"/>
    <line x1="-18" y1="12" x2="22" y2="12" class="ink"/>
    <rect x="-36" y="26" width="12" height="12" rx="2" fill="none" stroke="#9aa7b4" stroke-width="2"/>
    <line x1="-18" y1="32" x2="12" y2="32" class="ink"/>
    <circle cx="38" cy="40" r="20" fill="#1f6fd1"/>
    <polyline points="28,40 35,47 48,33" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== 02 Generalization in NLP tasks (amber), top-right ===== -->
  <g class="mono">
    <rect x="770" y="111" width="380" height="320" rx="18" fill="#0b1b29" fill-opacity="0.06"/>
    <rect x="770" y="108" width="380" height="320" rx="18" fill="#fff"/>
    <rect x="770" y="108" width="380" height="320" rx="18" fill="#b7791f" fill-opacity="0.05" stroke="#b7791f" stroke-width="2"/>
    <text x="798" y="150" class="num" fill="#b7791f">02</text>
    <text x="798" y="186" class="ttl">Generalization</text>
    <text x="798" y="216" class="ttl">in NLP tasks</text>
    <text x="798" y="288" class="kw">domain transfer</text>
    <text x="798" y="312" class="kw">adversarial perturbation </text>
    <text x="798" y="336" class="kw">shortcut learning</text>
    <text x="798" y="390" class="q">what does a model learn</text>
    <text x="798" y="408" class="q">and when does it transfer?</text>
  </g>
  <g transform="translate(1062 300)" class="mono">
    <line x1="-64" y1="40" x2="70" y2="40" stroke="#9aa7b4" stroke-width="2"/>
    <path d="M-64 40 C -44 40, -40 -34, -22 -34 C -4 -34, 0 40, 20 40" fill="#b7791f" fill-opacity="0.15" stroke="#b7791f" stroke-width="3"/>
    <path d="M-6 40 C 14 40, 18 -6, 34 -6 C 50 -6, 54 40, 72 40" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M-16 -44 Q 14 -60 28.2 -25.3" fill="none" stroke="#8a96a3" stroke-width="2.5"/>
    <polygon points="32,-16 32.8,-27.2 23.6,-23.4" fill="#8a96a3"/>
    <text x="-22" y="60" text-anchor="middle" font-size="12" fill="#6b7885">train</text>
    <text x="34" y="60" text-anchor="middle" font-size="12" fill="#6b7885">test</text>
  </g>

  <!-- ===== 03 Computational social science (red), bottom-right ===== -->
  <g class="mono">
    <rect x="770" y="541" width="380" height="320" rx="18" fill="#0b1b29" fill-opacity="0.06"/>
    <rect x="770" y="538" width="380" height="320" rx="18" fill="#fff"/>
    <rect x="770" y="538" width="380" height="320" rx="18" fill="#d64541" fill-opacity="0.04" stroke="#d64541" stroke-width="2"/>
    <text x="798" y="580" class="num" fill="#d64541">03</text>
    <text x="798" y="616" class="ttl">Computational</text>
    <text x="798" y="646" class="ttl">social science</text>
    <text x="798" y="718" class="kw">instrument validity</text>
    <text x="798" y="742" class="kw">model interbal stance</text>
    <text x="798" y="766" class="kw">social &amp; political bias</text>
    <text x="798" y="820" class="q">do model responses reveal attitudes,</text>
    <text x="798" y="838" class="q">or reflect how we ask?</text>
  </g>
  <g transform="translate(1066 660)">
    <rect x="-56" y="-54" width="112" height="108" rx="10" class="card"/>
    <line x1="-42" y1="-36" x2="28" y2="-36" class="ink"/>
    <g fill="none" stroke="#9aa7b4" stroke-width="2">
      <circle cx="-40" cy="-14" r="6"/><circle cx="-20" cy="-14" r="6"/><circle cx="0" cy="-14" r="6"/><circle cx="40" cy="-14" r="6"/>
      <circle cx="-40" cy="34" r="6"/><circle cx="-20" cy="34" r="6"/><circle cx="0" cy="34" r="6"/><circle cx="40" cy="34" r="6"/>
    </g>
    <circle cx="20" cy="-14" r="7" fill="#d64541"/>
    <line x1="-42" y1="12" x2="16" y2="12" class="ink"/>
    <circle cx="20" cy="34" r="7" fill="#d64541"/>
    <path d="M20 -4 V24" stroke="#d64541" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="54" cy="-52" r="16" fill="#d64541"/>
    <polyline points="46,-52 52,-46 62,-58" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== 04 Law, governance & compliance (purple), bottom-left ===== -->
  <g class="mono">
    <rect x="50" y="541" width="380" height="320" rx="18" fill="#0b1b29" fill-opacity="0.06"/>
    <rect x="50" y="538" width="380" height="320" rx="18" fill="#fff"/>
    <rect x="50" y="538" width="380" height="320" rx="18" fill="#7a4cc9" fill-opacity="0.04" stroke="#7a4cc9" stroke-width="2"/>
    <text x="78" y="580" class="num" fill="#7a4cc9">04</text>
    <text x="78" y="616" class="ttl">Law, governance</text>
    <text x="78" y="646" class="ttl">&amp; compliance</text>
    <text x="78" y="732" class="kw">Data use audit</text>
    <text x="78" y="756" class="kw">verifiable compliance</text>
    <text x="78" y="820" class="q">what evidence can interpretability</text>
    <text x="78" y="838" class="q">provide for a compliance claim?</text>
  </g>
  <g transform="translate(344 730)">
    <line x1="0" y1="-50" x2="0" y2="46" stroke="#8a96a3" stroke-width="5" stroke-linecap="round"/>
    <rect x="-30" y="46" width="60" height="10" rx="4" fill="#fff" stroke="#8a96a3" stroke-width="2.5"/>
    <line x1="-54" y1="-38" x2="54" y2="-38" stroke="#17212b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-52" r="7" fill="#7a4cc9"/>
    <g stroke="#9aa7b4" stroke-width="2">
      <line x1="-54" y1="-38" x2="-74" y2="12"/><line x1="-54" y1="-38" x2="-34" y2="12"/>
      <line x1="54" y1="-38" x2="34" y2="12"/><line x1="54" y1="-38" x2="74" y2="12"/>
    </g>
    <path d="M-80 12 Q-54 38 -28 12 Z" fill="#fff" stroke="#7a4cc9" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M28 12 Q54 38 80 12 Z" fill="#fff" stroke="#7a4cc9" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#7a4cc9" stroke-width="2">
      <line x1="-64" y1="4" x2="-54" y2="-10"/><line x1="-44" y1="4" x2="-54" y2="-10"/><line x1="-64" y1="4" x2="-44" y2="4"/>
    </g>
    <g fill="#7a4cc9"><circle cx="-64" cy="4" r="5"/><circle cx="-44" cy="4" r="5"/><circle cx="-54" cy="-10" r="5"/></g>
    <rect x="42" y="-18" width="24" height="30" rx="3" fill="#fff" stroke="#17212b" stroke-width="2"/>
    <text x="54" y="3" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#17212b">§</text>
  </g>
</svg>
